<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VU-GPT · Victoria University Kampala</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --vu-red:#D62246;
  --vu-red-dark:#9E1631;
  --vu-blue:#003D82;
  --vu-blue-dark:#001F42;
  --vu-blue-light:#2E6BC4;
  --ink:#0B1B33;
  --muted:#6B7A94;
  --glass:rgba(255,255,255,.62);
  --glass-brd:rgba(255,255,255,.75);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:#070C18;
  display:flex;align-items:center;justify-content:center;
  padding:24px;color:var(--ink);
}

/* ---------- App shell ---------- */
.app{
  position:relative;width:100%;max-width:1080px;height:min(780px,92vh);
  border-radius:28px;overflow:hidden;
  background:linear-gradient(150deg,#F7F9FF 0%,#EEF2FF 40%,#FFF0F4 100%);
  box-shadow:0 40px 120px rgba(0,20,60,.55),0 0 0 1px rgba(255,255,255,.08);
  display:flex;flex-direction:column;
}
/* animated aurora blobs */
.aurora{position:absolute;inset:0;overflow:hidden;pointer-events:none;filter:blur(60px);opacity:.55}
.blob{position:absolute;border-radius:50%}
.b1{width:520px;height:520px;background:radial-gradient(circle,#D62246 0%,transparent 70%);top:-180px;left:-140px;animation:drift1 18s ease-in-out infinite}
.b2{width:600px;height:600px;background:radial-gradient(circle,#003D82 0%,transparent 70%);bottom:-240px;right:-180px;animation:drift2 22s ease-in-out infinite}
.b3{width:400px;height:400px;background:radial-gradient(circle,#2E6BC4 0%,transparent 70%);top:40%;left:45%;animation:drift3 26s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(120px,80px) scale(1.15)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-100px,-70px) scale(1.1)}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(-90px,60px) scale(1.2)}66%{transform:translate(70px,-50px) scale(.9)}}

/* ---------- Top bar ---------- */
.topbar{
  position:relative;z-index:5;display:flex;align-items:center;gap:12px;
  padding:16px 22px;backdrop-filter:blur(20px);
  background:rgba(255,255,255,.45);border-bottom:1px solid rgba(255,255,255,.6);
}
.crest{
  width:38px;height:38px;border-radius:11px;flex-shrink:0;
  background:linear-gradient(140deg,var(--vu-blue),var(--vu-blue-dark));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:13px;letter-spacing:.5px;
  box-shadow:0 6px 18px rgba(0,61,130,.35),inset 0 0 0 1.5px var(--vu-red);
}
.brand h1{font-size:15px;font-weight:600;letter-spacing:-.2px;line-height:1.1}
.brand span{font-size:11.5px;color:var(--muted);font-weight:400}
.status{
  margin-left:auto;display:flex;align-items:center;gap:7px;
  font-size:11.5px;font-weight:500;color:var(--muted);
  padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.6);
  border:1px solid rgba(255,255,255,.8);
}
.dot{width:7px;height:7px;border-radius:50%;background:#22C55E;box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}

/* ---------- Stage ---------- */
.stage{
  position:relative;z-index:2;flex:1;display:flex;min-height:0;
  padding:18px 22px;gap:20px;
  transition:gap .7s cubic-bezier(.22,1,.36,1);
}
.avatar-col{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  flex:0 0 100%;
  transition:flex-basis .75s cubic-bezier(.22,1,.36,1);
}
.app.split .avatar-col{flex:0 0 42%}
.app.voice .avatar-col{flex:0 0 46%}

.avatar-stack{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#avatar-canvas{width:100%;height:100%;display:block;cursor:grab}
#avatar-canvas:active{cursor:grabbing}

/* halo rings behind avatar */
.halo{position:absolute;top:50%;left:50%;translate:-50% -50%;pointer-events:none;
  width:280px;height:280px;border-radius:50%;border:1.5px solid rgba(214,34,70,.22);
  opacity:0;transition:opacity .5s}
.halo.r2{width:340px;height:340px;border-color:rgba(0,61,130,.18)}
.halo.r3{width:400px;height:400px;border-color:rgba(46,107,196,.14)}
.app.listening .halo{opacity:1;animation:ripple 2.4s ease-out infinite}
.app.listening .halo.r2{animation-delay:.5s}
.app.listening .halo.r3{animation-delay:1s}
@keyframes ripple{0%{transform:scale(.75);opacity:.9}100%{transform:scale(1.25);opacity:0}}

.nameplate{
  position:absolute;bottom:8px;left:50%;translate:-50%;text-align:center;
  transition:opacity .5s,transform .5s;
}
.nameplate h2{font-size:19px;font-weight:600;letter-spacing:-.3px;color:var(--vu-blue-dark)}
.nameplate p{font-size:12px;color:var(--vu-red);font-weight:500;letter-spacing:.6px;text-transform:uppercase;margin-top:2px}
.app.split .nameplate,.app.voice .nameplate{opacity:0;transform:translateY(12px) scale(.94);pointer-events:none}

/* ---------- Chat panel ---------- */
.chat-col{
  flex:1 1 0;min-width:0;display:flex;flex-direction:column;
  opacity:0;transform:translateX(28px) scale(.97);
  pointer-events:none;
  transition:opacity .55s cubic-bezier(.22,1,.36,1),transform .55s cubic-bezier(.22,1,.36,1);
}
.app.split .chat-col{opacity:1;transform:none;pointer-events:auto}
.chat-inner{
  flex:1;min-height:0;overflow-y:auto;padding:14px 6px 14px 2px;
  display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth;
}
.chat-inner::-webkit-scrollbar{width:5px}
.chat-inner::-webkit-scrollbar-thumb{background:rgba(0,61,130,.2);border-radius:99px}

.bubble{
  max-width:86%;padding:11px 15px;font-size:14.2px;line-height:1.55;
  border-radius:18px;position:relative;
  animation:pop .5s cubic-bezier(.22,1.4,.4,1) both;
  backdrop-filter:blur(12px);
}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}
.bubble.user{
  align-self:flex-end;color:#fff;border-bottom-right-radius:6px;
  background:linear-gradient(135deg,var(--vu-red) 0%,var(--vu-red-dark) 100%);
  box-shadow:0 10px 26px rgba(214,34,70,.3);
}
.bubble.bot{
  align-self:flex-start;color:#F2F6FF;border-bottom-left-radius:6px;
  background:linear-gradient(135deg,var(--vu-blue) 0%,var(--vu-blue-dark) 100%);
  box-shadow:0 10px 26px rgba(0,61,130,.28);
}
.bubble .tag{display:block;font-size:10px;letter-spacing:.9px;text-transform:uppercase;opacity:.62;margin-bottom:3px;font-weight:500}

.typing{align-self:flex-start;display:flex;gap:5px;padding:14px 17px;border-radius:18px;border-bottom-left-radius:6px;
  background:linear-gradient(135deg,var(--vu-blue),var(--vu-blue-dark));box-shadow:0 10px 26px rgba(0,61,130,.28);
  animation:pop .4s cubic-bezier(.22,1.4,.4,1) both}
.typing i{width:7px;height:7px;border-radius:50%;background:#fff;opacity:.85;animation:bounce 1.3s infinite}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-6px);opacity:1}}

/* empty-state chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding-top:6px}
.chip{
  font-family:inherit;font-size:12.5px;font-weight:500;color:var(--vu-blue);
  padding:8px 14px;border-radius:999px;cursor:pointer;
  background:rgba(255,255,255,.72);border:1px solid rgba(0,61,130,.16);
  transition:transform .25s cubic-bezier(.22,1.4,.4,1),background .25s,box-shadow .25s;
  animation:pop .5s cubic-bezier(.22,1.4,.4,1) both;
}
.chip:hover{transform:translateY(-2px);background:#fff;box-shadow:0 8px 20px rgba(0,61,130,.16)}
.chip:active{transform:translateY(0) scale(.97)}

/* ---------- Voice panel ---------- */
.voice-col{
  flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  opacity:0;transform:translateX(28px) scale(.97);pointer-events:none;
  transition:opacity .55s cubic-bezier(.22,1,.36,1),transform .55s cubic-bezier(.22,1,.36,1);
}
.app.voice .voice-col{opacity:1;transform:none;pointer-events:auto}
.wave{display:flex;align-items:center;gap:5px;height:70px}
.wave b{width:5px;border-radius:99px;background:linear-gradient(180deg,var(--vu-red),var(--vu-blue));height:10px;transition:height .12s ease}
.timer{font-size:34px;font-weight:600;letter-spacing:1px;color:var(--vu-blue-dark);font-variant-numeric:tabular-nums}
.voice-hint{font-size:13.5px;color:var(--muted);font-weight:400;text-align:center;max-width:260px;line-height:1.5}
.transcript{
  font-size:14px;color:var(--vu-blue-dark);text-align:center;max-width:300px;line-height:1.55;
  padding:12px 18px;border-radius:16px;background:rgba(255,255,255,.7);
  border:1px solid rgba(255,255,255,.9);animation:pop .5s cubic-bezier(.22,1.4,.4,1) both;
}

/* ---------- Dock ---------- */
.dock{
  position:relative;z-index:5;display:flex;align-items:center;gap:10px;
  padding:14px 18px;backdrop-filter:blur(24px);
  background:rgba(255,255,255,.55);border-top:1px solid rgba(255,255,255,.7);
}
.field{
  flex:1;display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.85);border:1.5px solid rgba(0,61,130,.12);
  border-radius:16px;padding:4px 6px 4px 16px;
  transition:border-color .3s,box-shadow .3s,transform .3s;
}
.field:focus-within{border-color:var(--vu-red);box-shadow:0 0 0 4px rgba(214,34,70,.1)}
.field input{
  flex:1;border:0;outline:0;background:transparent;font-family:inherit;
  font-size:14.5px;color:var(--ink);padding:11px 0;
}
.field input::placeholder{color:#9AA8BF}
.icon-btn{
  width:42px;height:42px;flex-shrink:0;border:0;border-radius:13px;cursor:pointer;
  display:grid;place-items:center;font-size:17px;font-family:inherit;
  transition:transform .28s cubic-bezier(.22,1.4,.4,1),box-shadow .28s,background .28s,opacity .2s;
}
.icon-btn:hover:not(:disabled){transform:translateY(-2px)}
.icon-btn:active:not(:disabled){transform:translateY(0) scale(.94)}
.icon-btn:disabled{opacity:.4;cursor:not-allowed}
.send{background:linear-gradient(135deg,var(--vu-red),var(--vu-red-dark));color:#fff;box-shadow:0 8px 20px rgba(214,34,70,.34)}
.mode{background:rgba(0,61,130,.09);color:var(--vu-blue);border:1.5px solid rgba(0,61,130,.16)}
.mode.on{background:linear-gradient(135deg,var(--vu-blue),var(--vu-blue-dark));color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(0,61,130,.32)}
.rec{
  flex:1;height:52px;border:0;border-radius:16px;cursor:pointer;font-family:inherit;
  font-size:14.5px;font-weight:600;letter-spacing:.2px;color:#fff;
  display:flex;align-items:center;justify-content:center;gap:9px;
  background:linear-gradient(135deg,var(--vu-blue),var(--vu-blue-dark));
  box-shadow:0 10px 26px rgba(0,61,130,.32);
  transition:transform .28s cubic-bezier(.22,1.4,.4,1),box-shadow .28s,background .3s;
}
.rec:hover{transform:translateY(-2px)}
.rec:active{transform:translateY(0) scale(.985)}
.rec.live{background:linear-gradient(135deg,var(--vu-red),var(--vu-red-dark));box-shadow:0 10px 30px rgba(214,34,70,.4);animation:breathe 1.9s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 10px 30px rgba(214,34,70,.35)}50%{box-shadow:0 10px 44px rgba(214,34,70,.6)}}
.hide{display:none !important}

@media(max-width:820px){
  body{padding:0}
  .app{height:100vh;border-radius:0;max-width:100%}
  .stage{flex-direction:column;padding:12px}
  .app.split .avatar-col{flex:0 0 32%}
  .app.voice .avatar-col{flex:0 0 38%}
  .bubble{max-width:92%}
}
</style>
</head>
<body>

<div class="app" id="app">
  <div class="aurora"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>

  <header class="topbar">
    <div class="crest">VU</div>
    <div class="brand">
      <h1>VU-GPT</h1>
      <span>Victoria University · Kampala</span>
    </div>
    <div class="status"><span class="dot"></span><span id="statusText">Online</span></div>
  </header>

  <main class="stage">
    <section class="avatar-col">
      <div class="avatar-stack">
        <span class="halo r1"></span><span class="halo r2"></span><span class="halo r3"></span>
        <canvas id="avatar-canvas"></canvas>
      </div>
      <div class="nameplate">
        <h2>Meet VU-GPT</h2>
        <p>Your campus assistant</p>
      </div>
    </section>

    <section class="chat-col">
      <div class="chat-inner" id="chat"></div>
    </section>

    <section class="voice-col">
      <div class="wave" id="wave"></div>
      <div class="timer" id="timer">0:00</div>
      <p class="voice-hint" id="voiceHint">Tap the button below and ask me anything about campus life.</p>
    </section>
  </main>

  <footer class="dock">
    <div class="field" id="field">
      <input id="input" type="text" placeholder="Ask about programs, fees, housing…" autocomplete="off">
      <button class="icon-btn send" id="send" title="Send">➤</button>
    </div>
    <button class="rec hide" id="rec"><span id="recIcon">🎙</span><span id="recLabel">Start speaking</span></button>
    <button class="icon-btn mode" id="mode" title="Switch mode">🎙</button>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   3D AVATAR — procedural humanoid bust (Three.js r128)
   ============================================================ */
const Avatar = (() => {
  let scene, camera, renderer, root, head, jaw, browL, browR, lidL, lidR, eyeL, eyeR, chest, ringMesh;
  let clock, mouse = {x:0, y:0}, target = {x:0, y:0};
  let blinkTimer = 0, nextBlink = 2, blinkPhase = -1;
  let speaking = false, listening = false, speakEnergy = 0;
  let canvas;

  const SKIN    = 0x8A5836;
  const SKIN_D  = 0x6E4327;
  const SKIN_L  = 0xA26B45;
  const LIP     = 0x8C5B45;
  const HAIR    = 0x231913;
  const STUBBLE = 0x2A1C14;
  const SHIRT   = 0xF4F1EA;
  const SHIRT_D = 0xDED9CE;
  const ACCENT  = 0xD62246;
  const BASE_Y  = -0.70;

  function mat(color, rough = .62, metal = .05){
    return new THREE.MeshStandardMaterial({color, roughness: rough, metalness: metal});
  }

  function init(){
    canvas = document.getElementById('avatar-canvas');
    renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
    camera.position.set(0, 0.30, 5.5);

    // ---- lighting: warm key, cool fill, red + blue rims (VU colors)
    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const key = new THREE.DirectionalLight(0xfff2e6, 1.25);
    key.position.set(3, 4, 5); scene.add(key);
    const fill = new THREE.DirectionalLight(0xcfe0ff, 0.55);
    fill.position.set(-4, 1, 3); scene.add(fill);
    const rimRed = new THREE.PointLight(ACCENT, 1.5, 14);
    rimRed.position.set(-3.2, 1.4, -2.4); scene.add(rimRed);
    const rimBlue = new THREE.PointLight(0x2E6BC4, 1.5, 14);
    rimBlue.position.set(3.2, 0.6, -2.4); scene.add(rimBlue);

    root = new THREE.Group();
    root.position.y = BASE_Y;
    scene.add(root);

    buildBody();
    buildHead();

    clock = new THREE.Clock();
    window.addEventListener('resize', resize);
    canvas.addEventListener('pointermove', e => {
      const r = canvas.getBoundingClientRect();
      mouse.x = ((e.clientX - r.left) / r.width) * 2 - 1;
      mouse.y = ((e.clientY - r.top) / r.height) * 2 - 1;
    });
    canvas.addEventListener('pointerleave', () => { mouse.x = 0; mouse.y = 0; });

    resize();
    animate();
  }

  function buildBody(){
    chest = new THREE.Group();

    // torso in a soft white crew-neck tee
    const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.80, 1.16, 1.35, 56, 1, true), mat(SHIRT, .88));
    torso.material.side = THREE.DoubleSide;
    torso.position.y = -0.52;
    chest.add(torso);

    const shoulders = new THREE.Mesh(new THREE.SphereGeometry(1.02, 48, 28), mat(SHIRT, .88));
    shoulders.scale.set(1.22, 0.44, 0.76);
    shoulders.position.y = 0.02;
    chest.add(shoulders);

    // crew-neck collar band
    const collar = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.055, 16, 56), mat(SHIRT_D, .85));
    collar.rotation.x = Math.PI / 2;
    collar.position.y = 0.20;
    collar.scale.set(1, 1, .74);
    chest.add(collar);

    // small VU crest on the chest
    const crest = new THREE.Mesh(new THREE.CircleGeometry(0.10, 28), mat(0x003D82, .5));
    crest.position.set(-0.42, -0.28, 0.72);
    crest.rotation.y = -0.35;
    chest.add(crest);
    const crestRing = new THREE.Mesh(new THREE.TorusGeometry(0.10, 0.016, 10, 30), mat(ACCENT, .45));
    crestRing.position.copy(crest.position);
    crestRing.rotation.y = -0.35;
    chest.add(crestRing);

    // collarbone hint
    [-1, 1].forEach(sgn => {
      const cb = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.42, 12), mat(SKIN_D, .7));
      cb.rotation.z = Math.PI / 2 + sgn * 0.14;
      cb.position.set(0.30 * sgn, 0.08, 0.50);
      chest.add(cb);
    });

    // long neck with sterno muscle definition
    const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.29, 0.38, 0.72, 36), mat(SKIN_D, .66));
    neck.position.y = 0.44;
    chest.add(neck);
    [-1, 1].forEach(sgn => {
      const sm = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.085, 0.60, 14), mat(SKIN, .66));
      sm.rotation.z = sgn * 0.18;
      sm.position.set(0.16 * sgn, 0.40, 0.20);
      chest.add(sm);
    });

    root.add(chest);

    ringMesh = new THREE.Mesh(
      new THREE.TorusGeometry(1.42, 0.018, 12, 90),
      new THREE.MeshBasicMaterial({color: ACCENT, transparent:true, opacity:.35})
    );
    ringMesh.rotation.x = Math.PI / 2;
    ringMesh.position.y = -1.22;
    root.add(ringMesh);
  }

  function buildHead(){
    head = new THREE.Group();
    head.position.y = 1.02;

    const skinMat  = mat(SKIN, .58, .02);
    const skinDMat = mat(SKIN_D, .60, .02);

    // ---- cranium
    const skull = new THREE.Mesh(new THREE.SphereGeometry(0.62, 64, 48), skinMat);
    skull.scale.set(0.98, 1.14, 1.00);
    head.add(skull);

    // ---- cheekbones
    [-1, 1].forEach(sgn => {
      const cheek = new THREE.Mesh(new THREE.SphereGeometry(0.24, 24, 18), skinMat);
      cheek.scale.set(0.85, 0.62, 0.72);
      cheek.position.set(0.38 * sgn, -0.06, 0.34);
      head.add(cheek);
    });

    // ---- angular jaw + chin
    jaw = new THREE.Group();
    const jawMass = new THREE.Mesh(new THREE.SphereGeometry(0.52, 44, 34), skinMat);
    jawMass.scale.set(0.96, 0.70, 0.96);
    jawMass.position.set(0, -0.30, 0.04);
    jaw.add(jawMass);
    [-1, 1].forEach(sgn => {
      const angle = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.30, 0.34), skinMat);
      angle.position.set(0.44 * sgn, -0.26, 0.02);
      angle.rotation.z = sgn * 0.24;
      jaw.add(angle);
    });
    const chin = new THREE.Mesh(new THREE.SphereGeometry(0.20, 26, 20), skinMat);
    chin.scale.set(1.05, 0.78, 0.85);
    chin.position.set(0, -0.50, 0.30);
    jaw.add(chin);

    // ---- light stubble across jaw + chin
    const stubbleMat = new THREE.MeshStandardMaterial({
      color: STUBBLE, roughness: 1, transparent: true, opacity: 0.34
    });
    const stubble = new THREE.Mesh(new THREE.SphereGeometry(0.53, 40, 30), stubbleMat);
    stubble.scale.set(0.97, 0.60, 0.94);
    stubble.position.set(0, -0.36, 0.06);
    jaw.add(stubble);
    const chinStubble = new THREE.Mesh(new THREE.SphereGeometry(0.205, 22, 16), stubbleMat);
    chinStubble.scale.set(1.02, 0.80, 0.86);
    chinStubble.position.set(0, -0.51, 0.31);
    jaw.add(chinStubble);
    head.add(jaw);

    // ---- ears
    [-1, 1].forEach(sgn => {
      const ear = new THREE.Mesh(new THREE.SphereGeometry(0.135, 22, 18), skinDMat);
      ear.scale.set(0.40, 1.05, 0.72);
      ear.position.set(0.60 * sgn, -0.05, -0.01);
      head.add(ear);
      const lobe = new THREE.Mesh(new THREE.SphereGeometry(0.06, 14, 12), skinDMat);
      lobe.position.set(0.60 * sgn, -0.17, 0.01);
      head.add(lobe);
    });

    // ---- afro: dense puff cluster with a high hairline and a tight fade
    const hairMat = mat(HAIR, .99, 0);
    const scalp = new THREE.Mesh(new THREE.SphereGeometry(0.63, 40, 30), hairMat);
    scalp.scale.set(1.0, 1.10, 1.0);
    scalp.position.y = 0.12;
    head.add(scalp);

    const afro = new THREE.Group();
    let seed = 7;
    const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    for (let i = 0; i < 170; i++){
      const theta = rnd() * Math.PI * 2;
      const phi   = Math.acos(2 * rnd() - 1);
      const nx = Math.sin(phi) * Math.cos(theta);
      const ny = Math.cos(phi);
      const nz = Math.sin(phi) * Math.sin(theta);
      if (ny < -0.30) continue;                 // stop above the ear line
      if (nz > 0.42 && ny < 0.42) continue;     // keep the face and forehead clear
      const top = Math.max(0, ny);
      const rx = 0.70 + top * 0.10;
      const ry = 0.74 + top * 0.16;
      const rz = 0.68 + top * 0.08;
      const puff = new THREE.Mesh(new THREE.SphereGeometry(0.085 + rnd() * 0.06 + top * 0.055, 10, 8), hairMat);
      puff.position.set(nx * rx, ny * ry + 0.16, nz * rz);
      afro.add(puff);
    }
    // tighter fade at the temples
    for (let i = 0; i < 40; i++){
      const sgn = i % 2 ? 1 : -1;
      const a = rnd() * Math.PI - Math.PI / 2;
      const puff = new THREE.Mesh(new THREE.SphereGeometry(0.05 + rnd() * 0.025, 8, 6), hairMat);
      puff.position.set(0.58 * sgn, -0.10 + rnd() * 0.34, Math.sin(a) * 0.42 - 0.05);
      afro.add(puff);
    }
    head.add(afro);

    // sideburns
    [-1, 1].forEach(sgn => {
      const sb = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.24, 0.10), hairMat);
      sb.position.set(0.545 * sgn, -0.14, 0.22);
      sb.rotation.z = sgn * 0.06;
      head.add(sb);
    });

    // ---- thick, straight brows with a slight arch
    const browMat = mat(HAIR, .95);
    browL = new THREE.Group();
    browR = new THREE.Group();
    [[-1, browL], [1, browR]].forEach(([sgn, grp]) => {
      for (let i = 0; i < 5; i++){
        const seg = new THREE.Mesh(new THREE.BoxGeometry(0.075, 0.052 - i * 0.004, 0.06), browMat);
        seg.position.set(sgn * (0.10 + i * 0.072), 0.012 - i * i * 0.006, -i * i * 0.012);
        grp.add(seg);
      }
      grp.position.set(0, 0.175, 0.545);
    });
    head.add(browL, browR);

    // ---- eyes: warm brown iris, almond shape
    const whiteMat = new THREE.MeshStandardMaterial({color:0xEDE9E2, roughness:.26});
    const irisMat  = new THREE.MeshStandardMaterial({color:0x4A2C17, roughness:.16, metalness:.2});
    const pupilMat = new THREE.MeshBasicMaterial({color:0x140C06});
    [-1, 1].forEach(sgn => {
      const g = new THREE.Group();
      const ball = new THREE.Mesh(new THREE.SphereGeometry(0.115, 30, 24), whiteMat);
      ball.scale.set(1, .80, .70);
      const ir = new THREE.Mesh(new THREE.SphereGeometry(0.062, 24, 20), irisMat);
      ir.position.z = 0.070; ir.scale.set(1, 1, .55);
      const pu = new THREE.Mesh(new THREE.SphereGeometry(0.028, 16, 14), pupilMat);
      pu.position.z = 0.098; pu.scale.set(1, 1, .5);
      const gl = new THREE.Mesh(new THREE.SphereGeometry(0.016, 12, 10), new THREE.MeshBasicMaterial({color:0xffffff}));
      gl.position.set(0.026, 0.030, 0.112);
      g.add(ball, ir, pu, gl);
      g.position.set(0.222 * sgn, 0.035, 0.492);
      head.add(g);
      if (sgn < 0) eyeL = g; else eyeR = g;

      // upper lid with a shallow hood
      const lid = new THREE.Mesh(new THREE.SphereGeometry(0.128, 26, 20, 0, Math.PI*2, 0, Math.PI*0.5), skinMat);
      lid.scale.set(1, .82, .74);
      lid.position.set(0.222 * sgn, 0.038, 0.492);
      head.add(lid);
      if (sgn < 0) lidL = lid; else lidR = lid;

      // lower lash line shadow
      const under = new THREE.Mesh(new THREE.SphereGeometry(0.12, 20, 14), skinDMat);
      under.scale.set(1, .30, .48);
      under.position.set(0.222 * sgn, -0.055, 0.478);
      head.add(under);
    });

    // ---- nose: broader bridge, rounded tip, defined nostrils
    const bridge = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.30, 0.14), skinMat);
    bridge.position.set(0, 0.02, 0.555);
    bridge.rotation.x = 0.10;
    head.add(bridge);
    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.105, 24, 18), skinMat);
    tip.scale.set(1.05, 0.85, 0.95);
    tip.position.set(0, -0.15, 0.60);
    head.add(tip);
    [-1, 1].forEach(sgn => {
      const wing = new THREE.Mesh(new THREE.SphereGeometry(0.072, 18, 14), skinMat);
      wing.scale.set(0.85, 0.75, 0.85);
      wing.position.set(0.093 * sgn, -0.165, 0.555);
      head.add(wing);
      const nostril = new THREE.Mesh(new THREE.SphereGeometry(0.026, 12, 10), mat(0x33200F, .9));
      nostril.scale.set(1, .55, .8);
      nostril.position.set(0.048 * sgn, -0.205, 0.585);
      head.add(nostril);
    });

    // ---- full lips (upper + lower + cavity), driven by speakEnergy
    const lipMat = mat(LIP, .40, .04);
    const cavity = new THREE.Mesh(new THREE.SphereGeometry(0.14, 24, 18), mat(0x3A1A1C, .6));
    cavity.scale.set(1, .10, .34);
    cavity.position.set(0, -0.315, 0.505);
    head.add(cavity);

    const lipUp = new THREE.Group();
    [-1, 1].forEach(sgn => {
      const half = new THREE.Mesh(new THREE.SphereGeometry(0.10, 22, 16), lipMat);
      half.scale.set(1.15, 0.42, 0.55);
      half.position.set(0.062 * sgn, 0.006, 0);
      half.rotation.z = -sgn * 0.10;
      lipUp.add(half);
    });
    lipUp.position.set(0, -0.278, 0.525);
    head.add(lipUp);

    const lipLo = new THREE.Mesh(new THREE.SphereGeometry(0.135, 26, 20), lipMat);
    lipLo.scale.set(1.20, 0.50, 0.62);
    lipLo.position.set(0, -0.360, 0.520);
    head.add(lipLo);

    // philtrum shadow
    const phil = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.075, 0.03), skinDMat);
    phil.position.set(0, -0.228, 0.565);
    head.add(phil);

    head.userData.lips = {up: lipUp, lo: lipLo, cav: cavity};

    root.add(head);
  }

  function resize(){
    if (!canvas) return;
    const w = canvas.clientWidth || 1, h = canvas.clientHeight || 1;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }

  function animate(){
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    const dt = Math.min(clock.getDelta(), 0.05);

    // --- head look-at (eased toward pointer)
    target.x += (mouse.x * 0.42 - target.x) * 0.06;
    target.y += (mouse.y * 0.26 - target.y) * 0.06;
    head.rotation.y = target.x + Math.sin(t * 0.42) * 0.05;
    head.rotation.x = target.y * 0.55 + Math.sin(t * 0.33) * 0.025;
    head.rotation.z = Math.sin(t * 0.27) * 0.022;

    // --- idle breathing
    const breath = Math.sin(t * 1.25) * 0.5 + 0.5;
    chest.scale.set(1 + breath * 0.014, 1 + breath * 0.009, 1 + breath * 0.014);
    root.position.y = BASE_Y + Math.sin(t * 1.25) * 0.012;

    // --- blinking
    blinkTimer += dt;
    if (blinkPhase < 0 && blinkTimer > nextBlink){
      blinkPhase = 0; blinkTimer = 0;
      nextBlink = 2.4 + Math.random() * 3.4;
    }
    if (blinkPhase >= 0){
      blinkPhase += dt * 7.5;
      const k = blinkPhase < 1 ? blinkPhase : 2 - blinkPhase; // 0→1→0
      const closed = Math.max(0, Math.min(1, k));
      [lidL, lidR].forEach(l => { l.scale.y = 0.9 - closed * 0.02; l.rotation.x = closed * 1.75; });
      [eyeL, eyeR].forEach(e => { e.scale.y = 1 - closed * 0.9; });
      if (blinkPhase >= 2){ blinkPhase = -1; [lidL,lidR].forEach(l=>{l.rotation.x=0}); [eyeL,eyeR].forEach(e=>{e.scale.y=1}); }
    }

    // --- speaking: jaw + mouth
    const lips = head.userData.lips;
    if (speaking){
      speakEnergy = 0.42 + Math.abs(Math.sin(t * 11.5)) * 0.34 + Math.sin(t * 27) * 0.11;
    } else {
      speakEnergy += (0 - speakEnergy) * 0.14;
    }
    const open = Math.max(0, speakEnergy);
    lips.up.position.y = -0.278 + open * 0.012;
    lips.lo.position.y = -0.360 - open * 0.085;
    lips.lo.scale.set(1.20 - open * 0.10, 0.50 - open * 0.06, 0.62);
    lips.cav.scale.set(1 - open * 0.08, 0.10 + open * 0.62, 0.34 + open * 0.14);
    lips.cav.position.y = -0.315 - open * 0.038;
    jaw.position.y = -open * 0.075;
    jaw.rotation.x = open * 0.075;
    browL.position.y = 0.175 + open * 0.016;
    browR.position.y = 0.175 + open * 0.016;

    // --- listening: attentive brows + pedestal pulse
    if (listening){
      browL.rotation.z = 0.07 + Math.sin(t*3)*0.03 + 0.1;
      browR.rotation.z = -0.07 - Math.sin(t*3)*0.03 - 0.1;
      ringMesh.material.color.setHex(ACCENT);
      ringMesh.material.opacity = 0.35 + Math.abs(Math.sin(t*3.4))*0.45;
      ringMesh.scale.setScalar(1 + Math.sin(t*3.4)*0.05);
    } else {
      browL.rotation.z += (0.07 - browL.rotation.z)*0.1;
      browR.rotation.z += (-0.07 - browR.rotation.z)*0.1;
      ringMesh.material.color.setHex(speaking ? 0x2E6BC4 : ACCENT);
      ringMesh.material.opacity = 0.22 + Math.sin(t*1.4)*0.1;
      ringMesh.scale.setScalar(1);
    }
    ringMesh.rotation.z = t * 0.25;

    renderer.render(scene, camera);
  }

  return {
    init,
    resize,
    setSpeaking: v => speaking = v,
    setListening: v => listening = v,
    nod(){ // little acknowledgement dip
      const start = performance.now();
      const loop = () => {
        const p = (performance.now() - start) / 620;
        if (p >= 1) return;
        target.y = Math.sin(p * Math.PI) * 0.32;
        requestAnimationFrame(loop);
      };
      loop();
    }
  };
})();

/* ============================================================
   APP LOGIC
   ============================================================ */
const KB = [
  {k:['program','course','degree','study','faculty'], a:"Victoria University Kampala runs faculties in Business & Management, Health Sciences, Law, Science & Technology, and Humanities. Popular undergraduate tracks include BBA, Public Health, Software Engineering, and LLB. Which faculty should I open up for you?"},
  {k:['admission','apply','application','enrol','enroll','join'], a:"Applications run online through the VU admissions portal. You'll need your O-level and A-level results, two passport photos, a copy of your national ID or passport, and the application fee receipt. Intakes open in January, May, and August."},
  {k:['register','registration','semester','timetable'], a:"Course registration opens two weeks before each semester begins. Log into the student portal with your registration number, pick your modules, then confirm with the faculty administrator. Late registration attracts a penalty after week three."},
  {k:['hostel','housing','accommodation','residence','room'], a:"VU partners with several accredited hostels within walking distance of the Jinja Road campus. The Dean of Students' office handles placement — first-year and international students get priority. Rooms range from shared quads to self-contained singles."},
  {k:['fee','tuition','cost','pay','payment','money','bursary','scholarship'], a:"Tuition varies by programme and is payable per semester, with a 60% minimum required before exams. VU offers merit scholarships, sports bursaries, and a staggered payment plan through the Bursar's office."},
  {k:['library','book','study space','research'], a:"The VU library sits on the second block and is open 8am–10pm on weekdays, 9am–6pm on weekends. Your student ID doubles as your borrowing card, and the e-library gives you off-campus access to JSTOR and EBSCO."},
  {k:['location','where','campus','address','directions'], a:"The main campus is on Jinja Road in central Kampala, a short walk from the city centre. There's also a satellite learning centre serving evening and weekend students."},
  {k:['exam','result','grade','transcript'], a:"Examinations run at the end of each semester, and provisional results are posted on the student portal roughly three weeks after. Official transcripts are requested through the Academic Registrar's office."},
  {k:['hello','hi','hey','morning','afternoon','greet'], a:"Hello! I'm VU-GPT, the Victoria University Kampala assistant. I can help with programmes, admissions, fees, registration, hostels, and campus life. What would you like to know?"}
];
const FALLBACK = "That's a good question. I don't have that detail on hand yet, but the Academic Registrar's office on the main campus can help — or ask me about programmes, admissions, fees, registration, or hostels and I'll take it from there.";

const SUGGESTIONS = [
  "What programmes do you offer?",
  "How do I apply?",
  "Tell me about fees",
  "Is there student housing?",
  "When does registration open?"
];

const app       = document.getElementById('app');
const chat      = document.getElementById('chat');
const input     = document.getElementById('input');
const sendBtn   = document.getElementById('send');
const modeBtn   = document.getElementById('mode');
const recBtn    = document.getElementById('rec');
const recIcon   = document.getElementById('recIcon');
const recLabel  = document.getElementById('recLabel');
const field     = document.getElementById('field');
const timerEl   = document.getElementById('timer');
const waveEl    = document.getElementById('wave');
const voiceHint = document.getElementById('voiceHint');
const statusText= document.getElementById('statusText');

let voiceMode = false, busy = false, recording = false;
let recTime = 0, recTimer = null, waveTimer = null;
let audioCtx = null, analyser = null, micStream = null, dataArr = null;

// build waveform bars
for (let i = 0; i < 28; i++) waveEl.appendChild(document.createElement('b'));
const bars = waveEl.querySelectorAll('b');

function answerFor(text){
  const t = text.toLowerCase();
  for (const row of KB) if (row.k.some(k => t.includes(k))) return row.a;
  return FALLBACK;
}

function showChips(){
  if (chat.querySelector('.chips')) return;
  const wrap = document.createElement('div');
  wrap.className = 'chips';
  SUGGESTIONS.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = s;
    b.style.animationDelay = (i * 70) + 'ms';
    b.onclick = () => { wrap.remove(); send(s); };
    wrap.appendChild(b);
  });
  chat.appendChild(wrap);
}

function bubble(text, who){
  const el = document.createElement('div');
  el.className = 'bubble ' + who;
  if (who === 'bot'){
    const tag = document.createElement('span');
    tag.className = 'tag'; tag.textContent = 'VU-GPT';
    el.appendChild(tag);
  }
  el.appendChild(document.createTextNode(text));
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

function typing(){
  const el = document.createElement('div');
  el.className = 'typing';
  el.innerHTML = '<i></i><i></i><i></i>';
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

/* type-on effect so the avatar's mouth matches the text appearing */
function typeOut(el, text, done){
  let i = 0;
  const step = () => {
    i += Math.max(1, Math.round(text.length / 90));
    el.lastChild.textContent = text.slice(0, i);
    chat.scrollTop = chat.scrollHeight;
    if (i < text.length) setTimeout(step, 22);
    else done && done();
  };
  el.appendChild(document.createTextNode(''));
  step();
}

function send(text){
  if (busy || !text.trim()) return;
  const chips = chat.querySelector('.chips'); if (chips) chips.remove();

  busy = true;
  app.classList.add('split');
  sendBtn.disabled = true;
  bubble(text, 'user');
  input.value = '';

  const think = typing();
  statusText.textContent = 'Thinking';

  setTimeout(() => {
    think.remove();
    const reply = answerFor(text);
    const el = document.createElement('div');
    el.className = 'bubble bot';
    const tag = document.createElement('span');
    tag.className = 'tag'; tag.textContent = 'VU-GPT';
    el.appendChild(tag);
    chat.appendChild(el);

    Avatar.setSpeaking(true);
    statusText.textContent = 'Speaking';
    typeOut(el, reply, () => {
      Avatar.setSpeaking(false);
      Avatar.nod();
      statusText.textContent = 'Online';
      busy = false;
      sendBtn.disabled = false;
    });
  }, 900 + Math.random() * 700);
}

/* ---------- mode switching ---------- */
function setVoiceMode(on){
  voiceMode = on;
  app.classList.toggle('voice', on);
  app.classList.toggle('split', on ? false : chat.children.length > 0);
  field.classList.toggle('hide', on);
  recBtn.classList.toggle('hide', !on);
  modeBtn.classList.toggle('on', on);
  modeBtn.textContent = on ? '💬' : '🎙';
  modeBtn.title = on ? 'Switch to text' : 'Switch to voice';
  if (on){
    chat.innerHTML = '';
    voiceHint.textContent = 'Tap the button below and ask me anything about campus life.';
    timerEl.textContent = '0:00';
  } else {
    stopMic();
    showChips();
    app.classList.add('split');
  }
  setTimeout(Avatar.resize, 60);
}

/* ---------- microphone + live waveform ---------- */
async function startMic(){
  try {
    micStream = await navigator.mediaDevices.getUserMedia({audio:true});
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaStreamSource(micStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 64;
    src.connect(analyser);
    dataArr = new Uint8Array(analyser.frequencyBinCount);
  } catch(e){
    // no mic? fall back to a simulated waveform so the prototype still demos
    analyser = null;
  }

  recording = true;
  recTime = 0;
  app.classList.add('listening');
  Avatar.setListening(true);
  recBtn.classList.add('live');
  recIcon.textContent = '⏹';
  recLabel.textContent = 'Stop & send';
  voiceHint.textContent = 'Listening…';
  statusText.textContent = 'Listening';

  recTimer = setInterval(() => {
    recTime++;
    timerEl.textContent = fmt(recTime);
  }, 1000);

  waveTimer = setInterval(() => {
    bars.forEach((b, i) => {
      let v;
      if (analyser){
        analyser.getByteFrequencyData(dataArr);
        v = (dataArr[i % dataArr.length] / 255) * 60 + 6;
      } else {
        v = 8 + Math.abs(Math.sin(Date.now()/180 + i*0.6)) * (18 + Math.random()*34);
      }
      b.style.height = Math.round(v) + 'px';
    });
  }, 60);
}

function stopMic(){
  recording = false;
  clearInterval(recTimer); clearInterval(waveTimer);
  bars.forEach(b => b.style.height = '10px');
  app.classList.remove('listening');
  Avatar.setListening(false);
  recBtn.classList.remove('live');
  recIcon.textContent = '🎙';
  recLabel.textContent = 'Start speaking';
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  micStream = null; analyser = null;
}

const DEMO_UTTERANCES = [
  "What programmes does Victoria University offer?",
  "How much are the tuition fees?",
  "Is there student housing near campus?",
  "When does registration open?"
];

function finishVoiceTurn(){
  const spoken = DEMO_UTTERANCES[Math.floor(Math.random() * DEMO_UTTERANCES.length)];
  stopMic();

  voiceHint.innerHTML = '';
  const t = document.createElement('div');
  t.className = 'transcript';
  t.textContent = '“' + spoken + '”';
  voiceHint.replaceWith(t);
  t.id = 'voiceHint';

  statusText.textContent = 'Thinking';
  setTimeout(() => {
    const reply = answerFor(spoken);
    Avatar.setSpeaking(true);
    statusText.textContent = 'Speaking';
    const el = document.getElementById('voiceHint');
    el.className = 'voice-hint';
    el.textContent = '';
    let i = 0;
    const step = () => {
      i += 2;
      el.textContent = reply.slice(0, i);
      if (i < reply.length) setTimeout(step, 24);
      else {
        Avatar.setSpeaking(false);
        Avatar.nod();
        statusText.textContent = 'Online';
      }
    };
    step();
  }, 800);
}

/* ---------- wiring ---------- */
function fmt(s){ return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }

sendBtn.onclick = () => send(input.value);
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(input.value); });
modeBtn.onclick = () => setVoiceMode(!voiceMode);
recBtn.onclick  = () => recording ? finishVoiceTurn() : startMic();

window.addEventListener('DOMContentLoaded', () => {
  Avatar.init();
  setTimeout(() => {
    app.classList.add('split');
    bubble("Hello! I'm VU-GPT, the Victoria University Kampala assistant. Ask me about programmes, admissions, fees, registration, or campus life.", 'bot');
    showChips();
  }, 1400);
});
window.addEventListener('resize', () => Avatar.resize());
</script>
